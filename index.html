<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>
            迷你版校园公共信息与数据展示中心
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="net-tip" class="net-tip" hidden>网络已断开，请检查网络连接</div>

        <div class="container">
            <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
                <div class="container">
                    <a class="navbar-brand" href="#home">首页</a>
                    <div class="navbar-nav">
                        <a class="nav-link active" href="#home">首页</a>
                        <a class="nav-link active" href="#study">自习室</a>
                        <a class="nav-link active" href="#stats">统计</a>
                        <a class="nav-link active" href="campus.html">校园三维</a>
                    </div>
                </div>
            </nav>
        </div>

        <main class="container">
            <section id="home" class="page-section">
                <h2>首页</h2>
            </section>

            <section id="study" class="page-section">
                <h2>自习室</h2>

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <select id="floor-filter" class="form-select">
                            <option value="all">楼层：全部</option>
                            <option value="1">1楼</option>
                            <option value="2">2楼</option>
                            <option value="3">3楼</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <select id="status-filter" class="form-select">
                            <option value="all">状态：全部</option>
                            <option value="open">开放中</option>
                            <option value="closed">已关闭</option>
                        </select>
                    </div>
                </div>

                <ul id="room-list" class="list-group"></ul>
            </section>

            <section id="stats" class="page-section">
                <h2>统计</h2>
                <p id="sub-title" class="small text-muted"></p>
                <p id="status" class="small text-muted" hidden></p>

                <div id="cards" class="row g-3 mb-4"></div>

                <div class="row g-3">
                    <div class="col-12">
                        <h2 class="h5">各月自习室使用量（ECharts柱状图）</h2>
                        <div id="bar-chart" class="chart-box"></div>
                    </div>
                    <div class="col-12">
                        <h2 class="h5">自习室日使用量变化（Chart.js折线图）</h2>
                        <div class="chart-box"><canvas id="line-chart"></canvas></div>
                    </div>
                    <div class="col-12">
                        <h2 class="h5">各类自习室使用量占比（ECharts饼图）</h2>
                        <div id="pie-chart" class="chart-box"></div>
                    </div>
                </div>
            </section>
        </main>

        <script>
            const studyRooms = [
                { name: "一楼自习室A区", floor: 1, open: true, seats: 40 },
                { name: "一楼自习室B区", floor: 1, open: false, seats: 30 },
                { name: "二楼自习室C区", floor: 2, open: true, seats: 50 },
                { name: "二楼研讨间", floor: 2, open: false, seats: 20 },
                { name: "三楼考研自习室", floor: 3, open: true, seats: 60 },
                { name: "三楼电子阅览室", floor: 3, open: true, seats: 35 },
            ];

            const floorFilter = document.getElementById("floor-filter");
            const statusFilter = document.getElementById("status-filter");
            const roomList = document.getElementById("room-list");

            function renderRooms() {
                const f = floorFilter.value;
                const s = statusFilter.value;

                const result = studyRooms.filter(room =>
                    (f === "all" || room.floor === Number(f)) &&
                    (s === "all" || (s === "open") === room.open)
                );

                if (result.length === 0) {
                    roomList.innerHTML = '<li class="list-group-item">没有符合条件的自习室</li>';
                    return;
                }

                roomList.innerHTML = result.map(room => `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span>${room.name}（${room.floor}楼）</span>
                        <span class="badge ${room.open ? "bg-success" : "bg-secondary"}">
                            ${room.open ? "开放中" : "已关闭"} · ${room.seats}座
                        </span>
                    </li>
                `).join("");
            }

            floorFilter.addEventListener("change", renderRooms);
            statusFilter.addEventListener("change", renderRooms);
            renderRooms();
        </script>

        <!-- 纯原生且置于CDN之前：断网导致jQuery等加载失败时，断网横幅仍可工作 -->
        <script>
            (function () {
                var netTip = document.getElementById('net-tip');
                function updateNetTip() {
                    netTip.hidden = navigator.onLine;
                }
                window.addEventListener('online', updateNetTip);
                window.addEventListener('offline', updateNetTip);
                updateNetTip();
            })();
        </script>

        <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
